name: live_studio_asr
description: LIVE STUDIO ASR - painel Flutter para gerenciamento de lives.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cupertino_icons: ^1.0.8
  crypto: ^3.0.5
  web_socket_channel: ^3.0.1
  http: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/overlays/
    - assets/templates/
    - assets/illustrations/
